<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopee Admin | Broadcast Panel</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { 
            --shopee-orange: #ee4d2d; 
            --shopee-bg: #f5f5f5;
            --text-gray: #757575;
            --border-color: #e8e8e8;
        }

        body { 
            font-family: -apple-system, Helvetica Neue, Helvetica, Roboto, Arial, sans-serif; 
            background: var(--shopee-bg); 
            margin: 0; 
            padding: 0;
            color: #333;
        }

        .navbar {
            background: #fff;
            padding: 10px 20px;
            display: flex;
            align-items: center;
            box-shadow: 0 1px 1px rgba(0,0,0,.1);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .navbar img { height: 30px; margin-right: 15px; }
        .navbar span { font-size: 18px; color: var(--shopee-orange); font-weight: 500; }

        .container { max-width: 500px; margin: 20px auto; padding: 0 15px; }

        .stats-container {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: #fff;
            flex: 1;
            padding: 15px;
            border-radius: 4px;
            text-align: center;
            border: 1px solid var(--border-color);
        }

        .stat-card b { display: block; font-size: 22px; color: var(--shopee-orange); }
        .stat-card small { color: var(--text-gray); font-size: 12px; }

        .card { 
            background: #fff; 
            padding: 24px; 
            border-radius: 4px; 
            box-shadow: 0 1px 4px rgba(0,0,0,.05);
            border: 1px solid var(--border-color);
        }

        .card-title {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 20px;
            color: #333;
            border-left: 4px solid var(--shopee-orange);
            padding-left: 12px;
        }

        .form-group { margin-bottom: 20px; }

        label { 
            display: block; 
            font-size: 14px; 
            margin-bottom: 8px; 
            color: #333;
            font-weight: 500;
        }

        input, textarea { 
            width: 100%; 
            padding: 12px; 
            border: 1px solid var(--border-color); 
            border-radius: 4px;
            font-size: 14px;
            box-sizing: border-box;
            outline: none;
            background-color: #fafafa;
        }

        input:focus, textarea:focus { 
            border-color: var(--shopee-orange); 
            background-color: #fff;
        }

        textarea { resize: vertical; min-height: 100px; }

        button { 
            background: var(--shopee-orange); 
            color: #fff; 
            border: none; 
            padding: 15px; 
            width: 100%; 
            font-weight: bold; 
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover { background: #d73211; }
        button:active { transform: scale(0.98); }

        #log { 
            text-align: center; 
            font-size: 13px; 
            color: var(--text-gray); 
            margin-top: 15px;
            padding: 10px;
            background: #f9f9f9;
            border-radius: 4px;
        }
    </style>
</head>

<body>

<div class="navbar">
    <img src="https://upload.wikimedia.org/wikipedia/commons/f/fe/Shopee.svg" alt="Shopee">
    <span>Seller Center | Broadcast</span>
</div>

<div class="container">
    <div class="stats-container">
        <div class="stat-card"><b id="countTarget">0</b><small>Total Target</small></div>
    </div>

    <div class="card">
        <div class="card-title">Buat Notifikasi Baru</div>
        
        <div class="form-group">
            <label>Judul Notifikasi</label>
            <input id="title" placeholder="Contoh: Diskon Gila 99%!">
        </div>

        <div class="form-group">
            <label>Isi Pesan</label>
            <textarea id="body" placeholder="Masukkan pesan promo yang menarik..."></textarea>
        </div>

        <div class="form-group">
            <label>Link Affiliate Shopee</label>
            <input id="link" placeholder="https://shope.ee/xxxxxx">
        </div>

        <button onclick="broadcast()">KIRIM SEKARANG</button>
        <div id="log">Status: Menunggu...</div>
    </div>
</div>

<script>
    const supa = supabase.createClient(
        "https://zscupvelldysboqatuee.supabase.co",
        "sb_publishable_0PlYfd9A6FxFzO6YqMznrA_4RCpF9XR"
    );

    // GANTI DENGAN URL DEPLOYMENT GAS ANDA
    const GAS_URL = "https://script.google.com/macros/s/AKfycbwnrXAf7zZKjvawplDH_yqAkYuoXs8WIz6PS3b2tmjYHs0faY0DmdFqd8fl4tY-WRTR/exec";

    async function loadStats() {
        const { data } = await supa.from('subscriber').select('token').neq('token','');
        if(data) document.getElementById('countTarget').innerText = data.length;
    }
    loadStats();

    async function broadcast() {
        const titleVal = document.getElementById('title').value;
        const bodyVal = document.getElementById('body').value;
        const inputLink = document.getElementById('link').value;
        const logDiv = document.getElementById('log');

        if(!titleVal || !bodyVal || !inputLink) return alert("Mohon lengkapi semua data!");

        // OTOMATIS GABUNG LINK BRIDGE
        const finalLink = "https://dennysetiawan002-prog.github.io/shopeebridge/?url=" + encodeURIComponent(inputLink);

        const { data } = await supa.from('subscriber').select('token').neq('token','');
        if(!data || data.length === 0) return alert("Tidak ada token ditemukan!");

        if(!confirm(`Kirim broadcast ke ${data.length} user?`)) return;

        let success = 0;
        logDiv.innerText = "⏳ Sedang memproses...";

        for(const u of data) {
            const formData = new URLSearchParams();
            formData.append("token", u.token);
            formData.append("title", titleVal);
            formData.append("body", bodyVal);
            formData.append("link", finalLink);

            try {
                await fetch(GAS_URL, {
                    method: "POST",
                    mode: "no-cors",
                    body: formData
                });
                success++;
                logDiv.innerText = `🚀 Terproses: ${success} / ${data.length}`;
            } catch(e) { console.error(e); }
        }

        alert("Broadcast Selesai!");
        logDiv.innerText = "Status: Selesai (" + success + " terproses)";
    }
</script>

</body>
</html>
