<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Membuka Promo...</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f7f6; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; font-family: sans-serif; }
        .card { width: 90%; max-width: 400px; text-align: center; border-radius: 20px; border: none; padding: 35px; box-shadow: 0 10px 30px rgba(0,0,0,0.15); }
        .btn-shopee { background-color: #ee4d2d; color: white; padding: 18px; font-weight: bold; font-size: 1.3rem; border-radius: 15px; width: 100%; text-decoration: none; display: block; margin-top: 25px; border: none; box-shadow: 0 4px 15px rgba(238, 77, 45, 0.3); }
        .logo { width: 90px; margin-bottom: 25px; }
    </style>
</head>
<body>
    <div class="card">
        <img src="https://upload.wikimedia.org/wikipedia/commons/f/fe/Shopee.svg" class="logo">
        <h3 class="fw-bold">Promo Shopee</h3>
        <p class="text-secondary">Klik tombol di bawah untuk melihat detail produk di aplikasi.</p>
        
        <a href="#" id="btnBuka" class="btn-shopee">BUKA DI APLIKASI</a>
    </div>

    <script>
        // Fungsi mengambil parameter "url" dari link github
        function getQueryParam(param) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(param);
        }

        const targetUrl = getQueryParam('url');
        const btn = document.getElementById('btnBuka');

        if (targetUrl) {
            const encodedUrl = encodeURIComponent(targetUrl);
            const isAndroid = /Android/i.test(navigator.userAgent);

            if (isAndroid) {
                // Link Intent untuk Android (Paling Ampuh)
                btn.href = "intent://shopee.co.id/#Intent;scheme=https;package=com.shopee.id;S.browser_fallback_url=" + encodedUrl + ";end";
            } else {
                // Link standar untuk iOS/PC
                btn.href = targetUrl;
            }
        } else {
            btn.innerText = "LINK TIDAK VALID";
            btn.style.backgroundColor = "#ccc";
        }
    </script>
</body>
</html>
