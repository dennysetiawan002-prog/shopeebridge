<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shopee Admin | Broadcast</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root { --shopee:#ee4d2d; }
body{font-family:sans-serif;background:#f5f5f5;margin:0;padding:15px}
.header{background:var(--shopee);color:#fff;padding:15px;border-radius:8px;text-align:center;font-weight:bold}
.card{background:#fff;padding:20px;border-radius:8px;margin-top:15px}
button{background:var(--shopee);color:#fff;border:none;padding:15px;width:100%;font-weight:bold;border-radius:5px}
select,input,textarea{width:100%;padding:12px;margin:8px 0}
#log{text-align:center;font-size:12px;color:#777}
</style>
</head>

<body>

<div class="header">SHOPEE BROADCAST PANEL</div>

<div class="card">
<label>Judul</label>
<input id="title">

<label>Pesan</label>
<textarea id="body"></textarea>

<label>Link</label>
<input id="link">

<button onclick="broadcast()">KIRIM</button>
<div id="log">Siap</div>
</div>

<script>
const supa = supabase.createClient(
 "https://zscupvelldysboqatuee.supabase.co",
 "sb_publishable_0PlYfd9A6FxFzO6YqMznrA_4RCpF9XR"
);

async function broadcast(){
 const { data } = await supa.from('subscriber').select('token').neq('token','');
 if(!data || !data.length) return alert("Tidak ada token");

 let success = 0;
 log.innerText = "Mengirim...";

 for(const u of data){
   const p = new URLSearchParams();
   p.append("token", u.token);
   p.append("title", title.value);
   p.append("body", body.value);
   p.append("link", link.value);

   try{
     // ⬇️ INI KUNCI UTAMANYA
     fetch(
       "https://script.google.com/macros/s/AKfycbwnrXAf7zZKjvawplDH_yqAkYuoXs8WIz6PS3b2tmjYHs0faY0DmdFqd8fl4tY-WRTR/exec",
       {
         method: "POST",
         mode: "no-cors",
         body: p
       }
     );
     success++;
     log.innerText = "Terkirim: " + success;
   }catch(e){}
 }

 alert("Broadcast selesai. Dikirim: " + success);
}
</script>
</body>
</html>
