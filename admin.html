<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopee Admin | Broadcast Panel</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { 
            --shopee-orange: #ee4d2d; 
            --shopee-bg: #f5f5f5;
            --text-gray: #757575;
            --border-color: #e8e8e8;
        }

        body { 
            font-family: -apple-system, Helvetica Neue, Helvetica, Roboto, Arial, sans-serif; 
            background: var(--shopee-bg); 
            margin: 0; 
            padding: 0;
            color: #333;
        }

        /* Header Shopee Style */
        .navbar {
            background: #fff;
            padding: 10px 20px;
            display: flex;
            align-items: center;
            box-shadow: 0 1px 1px rgba(0,0,0,.1);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .navbar img { height: 32px; margin-right: 15px; }
        .navbar span { font-size: 18px; color: var(--shopee-orange); font-weight: 500; }

        .container { max-width: 500px; margin: 20px auto; padding: 0 15px; }

        /* Statistik Box */
        .stats-container {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: #fff;
            flex: 1;
            padding: 15px;
            border-radius: 4px;
            text-align: center;
            border: 1px solid var(--border-color);
        }

        .stat-card b { display: block; font-size: 20px; color: var(--shopee-orange); }
        .stat-card small { color: var(--text-gray); font-size: 12px; }

        /* Form Card */
        .card { 
            background: #fff; 
            padding: 24px; 
            border-radius: 4px; 
            box-shadow: 0 1px 4px rgba(0,0,0,.05);
        }

        .card-title {
            font-size: 16px;
            font-weight: 500;
            margin-bottom: 20px;
            border-left: 4px solid var(--shopee-orange);
            padding-left: 10px;
        }

        .form-group { margin-bottom: 18px; }

        label { 
            display: block; 
            font-size: 14px; 
            margin-bottom: 8px; 
            color: #333;
            font-weight: 500;
        }

        input, textarea, select { 
            width: 100%; 
            padding: 12px; 
            border: 1px solid var(--border-color); 
            border-radius: 2px;
            font-size: 14px;
            box-sizing: border-box;
            outline: none;
            transition: border 0.3s;
        }

        input:focus, textarea:focus { border-color: var(--shopee-orange); }

        textarea { resize: vertical; min-height: 80px; }

        button { 
            background: var(--shopee-orange); 
            color: #fff; 
            border: none; 
            padding: 14px; 
            width: 100%; 
            font-weight: bold; 
            border-radius: 2px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s;
            margin-top: 10px;
        }

        button:hover { background: #d73211; }
        button:active { transform: scale(0.99); }

        #log { 
            text-align: center; 
            font-size: 13px; 
            color: var(--text-gray); 
            margin-top: 15px;
            padding: 10px;
            background: #f9f9f9;
            border-radius: 4px;
        }

        .footer-info {
            text-align: center;
            margin-top: 30px;
            font-size: 12px;
            color: #bbb;
        }
    </style>
</head>

<body>

<div class="navbar">
    <img src="https://upload.wikimedia.org/wikipedia/commons/f/fe/Shopee.svg" alt="Shopee">
    <span>Seller Center | Broadcast</span>
</div>

<div class="container">
    <div class="stats-container">
        <div class="stat-card"><b id="countUser">0</b><small>Total Subscriber</small></div>
        <div class="stat-card"><b id="countTarget">0</b><small>Target Aktif</small></div>
    </div>

    <div class="card">
        <div class="card-title">Buat Notifikasi Baru</div>
        
        <div class="form-group">
            <label>Judul Notifikasi</label>
            <input id="title" placeholder="Contoh: Voucher Diskon 99% Menantimu!">
        </div>

        <div class="form-group">
            <label>Isi Pesan</label>
            <textarea id="body" placeholder="Masukkan detail promo yang menarik..."></textarea>
        </div>

        <div class="form-group">
            <label>Link Tujuan (Shopee Affiliate)</label>
            <input id="link" placeholder="https://shope.ee/xxxxxx">
        </div>

        <button onclick="broadcast()">KIRIM BROADCAST</button>
        <div id="log">Status: Menunggu instruksi...</div>
    </div>

    <div class="footer-info">Shopee Admin Panel v2.0 - 2026</div>
</div>

<script>
// SERVICE WORKER
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/shopeebridge/firebase-messaging-sw.js', { scope: '/shopeebridge/' })
  .then(() => console.log('SW Registered')).catch(err => console.error('SW Error:', err));
}

// SUPABASE
const supa = supabase.createClient(
  "https://zscupvelldysboqatuee.supabase.co",
  "sb_publishable_0PlYfd9A6FxFzO6YqMznrA_4RCpF9XR"
);

// LOAD STATS
async function loadStats() {
    const { data } = await supa.from('subscriber').select('token').neq('token','');
    if(data) {
        countUser.innerText = data.length;
        countTarget.innerText = data.length;
    }
}
loadStats();

// BROADCAST
async function broadcast() {
    const titleVal = document.getElementById('title').value;
    const bodyVal = document.getElementById('body').value;
    const linkVal = document.getElementById('link').value;

    if(!titleVal || !bodyVal || !linkVal) {
        alert("Mohon isi semua data!");
        return;
    }

    const { data } = await supa.from('subscriber').select('token').neq('token','');

    if(!data || !data.length){
        alert("Tidak ada user untuk dikirim.");
        return;
    }

    if(!confirm(`Kirim broadcast ke ${data.length} user?`)) return;

    let success = 0;
    const logDiv = document.getElementById('log');
    logDiv.innerText = "⏳ Sedang memproses pengiriman...";

    for(const u of data) {
        const p = new URLSearchParams();
        p.append("token", u.token);
        p.append("title", titleVal);
        p.append("body", bodyVal);
        p.append("link", linkVal);

        try {
            await fetch(
                "https://script.google.com/macros/s/AKfycbwnrXAf7zZKjvawplDH_yqAkYuoXs8WIz6PS3b2tmjYHs0faY0DmdFqd8fl4tY-WRTR/exec",
                { method: "POST", mode: "no-cors", body: p }
            );
            success++;
            logDiv.innerText = `🚀 Terkirim: ${success} dari ${data.length}`;
        } catch(e) {
            console.error("Gagal kirim ke salah satu user");
        }
    }

    alert("✅ Broadcast Selesai! Total: " + success + " user.");
    logDiv.innerText = "Status: Broadcast Selesai (" + success + ")";
}
</script>

</body>
</html>
